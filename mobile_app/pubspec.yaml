name: vision_assistant
description: Mobile client for the Vision Assistant walking-assistance backend.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  camera_android: any
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  vibration: ^2.0.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  image: ^4.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
